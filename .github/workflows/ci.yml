name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes the in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Playwright's webServer builds too; keep both jobs on the same Node target.
  NODE_VERSION: '22'
  BUN_VERSION: '1.3.1'

jobs:
  checks:
    name: Lint, contracts and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: bun install --frozen-lockfile

      - run: bun run lint

      # Content, SEO and compliance contracts. No browser, so this fails fast.
      - run: bun run test

      - run: bun run build

  e2e:
    name: Rendering and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: bun install --frozen-lockfile

      # Both Playwright projects are Chromium-based; the other engines are dead weight.
      - run: bunx playwright install --with-deps chromium

      # playwright.config.ts runs `bun run build && bun run start` itself.
      - run: bun run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
